<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VE-Log Registrierung</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    background:#fff;
    padding:30px;
    width:380px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.register-btn{
    margin-top:10px;
    background:#9b2d2d;
    color:white;
}

.register-btn:hover{
    background:#7d2323;
}

.back-btn{
    background:#666;
    color:white;
    margin-bottom:15px;
}

.back-btn:hover{
    background:#555;
}

.info{
    font-size:13px;
    color:#666;
    margin-top:10px;
    text-align:center;
}
</style>
</head>
<body>

<div class="box">

    <button class="back-btn"
        onclick="window.location.href='index.html'">
        ← Zurück zum Login
    </button>

    <h2>Registrierung</h2>

    <input id="vorname" type="text" placeholder="Vorname">
    <input id="nachname" type="text" placeholder="Nachname">
    <input id="email" type="email" placeholder="E-Mail">
    <input id="handy" type="text" placeholder="Telefonnummer">
    <input id="passwort" type="password" placeholder="Passwort">
    <input id="passwort2" type="password" placeholder="Passwort wiederholen">

    <button class="register-btn"
        onclick="registrieren()">
        Registrieren
    </button>

    <div class="info">
        VE-Log Mitarbeiterkonto erstellen
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDXTAVTeddKxwOp_C_2Z4lPY9yI5bAm0KM",
    authDomain: "ve-log.firebaseapp.com",
    databaseURL: "https://ve-log-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ve-log",
    storageBucket: "ve-log.firebasestorage.app",
    messagingSenderId: "749978080433",
    appId: "1:749978080433:web:8f64ef99a557fe2346be90"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

window.registrieren = async function() {

    const vorname = document.getElementById("vorname").value.trim();
    const nachname = document.getElementById("nachname").value.trim();
    const email = document.getElementById("email").value.trim();
    const handy = document.getElementById("handy").value.trim();
    const passwort = document.getElementById("passwort").value;
    const passwort2 = document.getElementById("passwort2").value;

    if(!vorname || !nachname || !email || !passwort){
        alert("Bitte alle Pflichtfelder ausfüllen.");
        return;
    }

    if(passwort !== passwort2){
        alert("Passwörter stimmen nicht überein.");
        return;
    }

    try{

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                passwort
            );

        const uid = userCredential.user.uid;

        await set(ref(database, "users/" + uid), {
            uid: uid,
            vorname: vorname,
            nachname: nachname,
            email: email,
            handy: handy,
            rolle: "mitarbeiter",
            aktiv: true,
            erstelltAm: new Date().toISOString()
        });

        await set(
            ref(database, "roles/" + uid),
            "mitarbeiter"
        );

        alert("Registrierung erfolgreich.");

        window.location.href = "index.html";

    } catch(error){

        console.error(error);

        if(error.code === "auth/email-already-in-use"){
            alert("Diese E-Mail ist bereits registriert.");
        }
        else if(error.code === "auth/weak-password"){
            alert("Passwort muss mindestens 6 Zeichen lang sein.");
        }
        else if(error.code === "auth/invalid-email"){
            alert("Ungültige E-Mail-Adresse.");
        }
        else{
            alert(error.message);
        }
    }
};

</script>

</body>
</html>
